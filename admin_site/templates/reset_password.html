<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="/admin_site/static/images/VATION.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .reset_password-container {
            width: 350px;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }

        .reset_password-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .reset_password-container label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: left;
        }

        .reset_password-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .reset_password-container input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        .reset_password-container button {
            width: 48%;
            padding: 10px;
            background-color: #4CAF50;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px 1%;
            box-sizing: border-box;
        }

        .reset_password-container button:hover {
            background-color: #45a049;
        }

        .clear-button {
            background-color: #f44336;
        }

        .clear-button:hover {
            background-color: #e53935;
        }

        .message {
            margin-top: 15px;
            color: #28a745;
            font-weight: bold;
        }

        .error-message {
            color: #dc3545;
            margin-top: 10px;
            font-size: 14px;
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .buttons-container button {
            width: 48%;
        }

        /* Position the date-time at top right */
        .date-time {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #333;
        }
    </style>
    <script>
        function validatePasswords() {
            const password = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // Regular expression for password validation
            const passwordRegex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

            if (!passwordRegex.test(password)) {
                document.getElementById('error-message').textContent = "Password must be at least 8 characters long, include 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special character.";
                return false;
            }

            if (password !== confirmPassword) {
                document.getElementById('error-message').textContent = "Passwords do not match!";
                return false;
            } else {
                document.getElementById('error-message').textContent = "";
                return true;
            }
        }

        function clearFields() {
            document.getElementById('new_password').value = '';
            document.getElementById('confirm_password').value = '';
            document.getElementById('error-message').textContent = '';
        }

        function updateDateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('dateTime').textContent = now.toLocaleString('en-US', options);
        }

        setInterval(updateDateTime, 1000); // Update every second
    </script>
</head>
<body>

<div class="reset_password-container">
    <img src="/admin_site/static/images/LOGO.png" alt="Logo" style="width: 100px; height: auto;">
    <div class="date-time" id="dateTime"></div>
    <h2>Reset Password</h2>
    <form onsubmit="return validatePasswords()" method="POST">
        {% csrf_token %}

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="New Password" required>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" required>

        <div class="buttons-container">
            <button type="submit">Submit</button>
            <button type="button" class="clear-button" onclick="clearFields()">Clear</button>
        </div>
    </form>

    <div class="error-message" id="error-message"></div>

    {% if password_changed %}
        <div class="message">Password changed successfully!</div>
    {% endif %}
</div>

</body>
</html>
