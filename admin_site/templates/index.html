{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link rel="icon" type="image/x-icon" href="/admin_site/static/images/VATION.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 10px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .header img {
            width: 80px;
            height: auto;
        }
        .date-time {
            font-size: 14px;
            color: #555;
        }
        .container {
            width: 50%;
            margin: 40px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .form-table {
            width: 100%;
            border-collapse: collapse;
        }
        .form-table td {
            padding: 10px;
        }
        .form-table td:first-child {
            width: 30%;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
        .messages {
            margin-bottom: 20px;
        }
        .messages div {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="/admin_site/static/images/LOGO.png" alt="Logo">
        <div class="date-time" id="dateTime"></div>
    </div>
    <div class="container">
        <h3>Add User</h3>
        {% if messages %}
        <div class="messages">

        </div>
        {% endif %}
        <form method="POST" onsubmit="return validateForm()">
            {% csrf_token %}
            <table class="form-table">
                <tr>
                    <td><label for="username">Username:</label></td>
                    <td>
                        <input type="text" name="username" id="username" pattern="[a-z\-]+" title="Only lowercase letters and hyphens are allowed" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="password">Password:</label></td>
                    <td>
                        <input type="password" name="password" id="password" required>
                        <div id="password-error" class="error-message" style="display: none;">
                            Password must be at least 8 characters with uppercase, lowercase, number, and special character.
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="confirm_password">Confirm Password:</label></td>
                    <td>
                        <input type="password" name="confirm_password" id="confirm_password" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="mail_id">Email:</label></td>
                    <td>
                        <input type="email" name="mail_id" id="mail_id" pattern="^[a-zA-Z0-9._%+-]+@klu\.in$" title="Email must end with @klu.in" required>
                        <div id="email-error" class="error-message" style="display: none;">
                            Email must end with @klu.in
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="first_name">First Name:</label></td>
                    <td>
                        <input type="text" name="first_name" id="first_name" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="last_name">Last Name:</label></td>
                    <td>
                        <input type="text" name="last_name" id="last_name" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="phone_number">Contact:</label></td>
                    <td>
                        <input type="text" name="phone_number" id="phone_number" pattern="[0-9]{10}" title="Please enter 10 digits" required>
                    </td>
                </tr>
                <tr>
                    <td><label>Role:</label></td>
                    <td>
                        <input type="checkbox" name="roles" value="user" id="role_user"> <label for="role_user">User</label><br>
                        <input type="checkbox" name="roles" value="admin" id="role_admin"> <label for="role_admin">Admin</label>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button type="submit" class="btn">Add User</button>
                    </td>
                </tr>
            </table>
        </form>
    </div>
    <script>
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            const email = document.getElementById('mail_id').value;
            const emailRegex = /^[a-zA-Z0-9._%+-]+@klu\.in$/;

            let isValid = true;

            if (!passwordRegex.test(password)) {
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                isValid = false;
            }

            if (!emailRegex.test(email)) {
                document.getElementById('email-error').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('email-error').style.display = 'none';
            }

            return isValid;
        }

        // Function to update date and time
        function updateDateTime() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('dateTime').textContent = now.toLocaleString('en-US', options);
        }

        setInterval(updateDateTime, 1000); // Update every second
    </script>
</body>
</html>
