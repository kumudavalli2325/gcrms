{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User</title>
    <link rel="icon" type="image/x-icon" href="/admin_site/static/images/VATION.png">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            align-items: center;
            background-color: #fff;
            padding: 10px 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .header-left {
            display: flex;
            align-items: center;
            flex-direction: column;
        }
        .header-left img {
            height: 200px;
            margin-bottom: 10px;
        }
        .header-left .date-time {
            font-size: 16px;
            color: #555;
        }
        .title-date {
            display: flex;
            align-items: center;
            margin-left: 20px;
        }
        .title-date img {
            height: 100px;
            margin-right: 15px;
        }
        .title-date h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }
        .title-date .date-time {
            font-size: 14px;
            color: #555;
        }
        .container {
            width: 50%;
            margin: 40px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h3.form-title {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-table {
            width: 100%;
            border-collapse: collapse;
        }
        .form-table td {
            padding: 10px;
        }
        .form-table td:first-child {
            text-align: right;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            font-size: 14px;
            text-align: center;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #007bff;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .error-message {
            color: red;
            font-size: 12px;
        }
        .success-message {
            color: green;
            font-size: 12px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .checkbox-container input {
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
        }
        #password-requirements {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
    <script>
        function updateDateTime() {
            const dateTimeElement = document.getElementById('date-time');
            const currentTimeElement = document.getElementById('current-time');
            const now = new Date();
            const options = {
                timeZone: 'Asia/Kolkata',
                hour12: true,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            const timeOptions = {
                timeZone: 'Asia/Kolkata',
                hour12: true,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            dateTimeElement.textContent = new Intl.DateTimeFormat('en-IN', options).format(now);
            currentTimeElement.textContent = new Intl.DateTimeFormat('en-IN', timeOptions).format(now);
        }

        setInterval(updateDateTime, 1000);

        // Email validation function
        function validateEmail() {
            const emailField = document.getElementById('mail_id');
            const emailValue = emailField.value;
            const emailRegex = /^[a-zA-Z0-9._%+-]+@klu\.in$/;
            const emailError = document.getElementById('email-error');
            if (!emailRegex.test(emailValue)) {
                emailError.style.display = 'block';
                return false;
            } else {
                emailError.style.display = 'none';
                return true;
            }
        }

        // Password validation function
        function validatePassword(password) {
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            const passwordError = document.getElementById('password-error');
            if (!passwordRegex.test(password)) {
                passwordError.style.display = 'block';
                return false;
            } else {
                passwordError.style.display = 'none';
                return true;
            }
        }

        // Form validation on submit
        function validateForm() {
            const emailValid = validateEmail();
            if (!emailValid) return false;

            const passwordField = document.getElementById('password');
            const passwordValid = validatePassword(passwordField.value);
            if (!passwordValid) return false;

            const confirmPasswordField = document.getElementById('confirm_password');
            if (passwordField.value !== confirmPasswordField.value) {
                alert("Passwords do not match.");
                return false;
            }

            return true;
        }

        // Update roles field to store selected roles as comma-separated string
        function updateRoles() {
            const roles = [];
            if (document.getElementById('role_admin').checked) {
                roles.push("Admin");
            }
            if (document.getElementById('role_user').checked) {
                roles.push("User");
            }
            document.getElementById('roles_input').value = roles.join(',');
        }

        // Add event listeners to update roles before form submission
        document.getElementById('role_admin').addEventListener('change', updateRoles);
        document.getElementById('role_user').addEventListener('change', updateRoles);

        // Initialize roles field on page load
        window.onload = updateRoles;
    </script>
</head>
<body>
    <div class="header">
        <div>
            <img src="/admin_site/static/images/LOGO.png" alt="Logo" style="width: 80px;height: auto"/>
            </div>
        <div class="header-left">
            <div id="current-time" class="date-time"></div>
        </div>
                <div class="date-time" id="date-time"></div>
            </div>
        </div>
    </div>
    <div class="container">
        <h3 class="form-title">Create User</h3>
        <form method="POST" class="post-form" onsubmit="return validateForm()">
            {% csrf_token %}
            <table class="form-table">
                <tr>
                    <td><label for="username" class="required">Username:</label></td>
                    <td>
                        <input type="text" name="username" id="username" required maxlength="50" value="{{ form.username.value|default:'' }}">
                        {% if form.username.errors %}
                        <div class="error-message">{{ form.username.errors }}</div>
                        {% endif %}
                    </td>
                </tr>
                <tr>
                    <td><label for="password" class="required">Password:</label></td>
                    <td>
                        <input type="password" name="password" id="password" required maxlength="100">
                        <div id="password-error" class="error-message" style="display: none;">
                            Password must include at least 8 characters, 1 uppercase, 1 lowercase, 1 special character, and 1 number.
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="confirm_password" class="required">Confirm Password:</label></td>
                    <td>
                        <input type="password" name="confirm_password" id="confirm_password" required maxlength="100">
                    </td>
                </tr>
                <tr>
                    <td><label for="mail_id" class="required">Email:</label></td>
                    <td>
                        <input type="email" name="mail_id" id="mail_id" required maxlength="100" value="{{ form.mail_id.value|default:'' }}">
                        <div id="email-error" class="error-message" style="display: none;">
                            Email must end with "@klu.in".
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="first_name" class="required">First Name:</label></td>
                    <td>
                        <input type="text" name="first_name" id="first_name" required maxlength="100" value="{{ form.first_name.value|default:'' }}">
                    </td>
                </tr>
                <tr>
                    <td><label for="last_name" class="required">Last Name:</label></td>
                    <td>
                        <input type="text" name="last_name" id="last_name" required maxlength="100" value="{{ form.last_name.value|default:'' }}">
                    </td>
                </tr>
                <tr>
                    <td><label for="phone_number" class="required">Contact:</label></td>
                    <td>
                        <input type="text" name="phone_number" id="phone_number" required maxlength="15" value="{{ form.phone_number.value|default:'' }}">
                    </td>
                </tr>
                <tr>
                    <td><label for="roles" class="required">Roles:</label></td>
                    <td>
                        <div class="checkbox-group">
                            <input type="checkbox" name="roles" id="role_admin" value="Admin"> Admin<br>
                            <input type="checkbox" name="roles" id="role_user" value="User" checked> User<br>
                        </div>
                        <!-- Hidden input to store the roles -->
                        <input type="hidden" name="roles_input" id="roles_input" value="">
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit" class="btn btn-primary">Submit</button></td>
                </tr>
            </table>
        </form>
    </div>
